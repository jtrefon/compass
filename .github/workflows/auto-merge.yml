name: Auto-merge automated PRs

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  workflow_dispatch:

# Cascade: only ONE auto-merge operation in flight at a time.
# Combined with branch protection (strict, required CI) this means:
# update branch -> re-run CI on the updated head -> merge -> next PR's turn.
# No parallel merges, no stale branches, no conflicts.
concurrency:
  group: auto-merge-queue
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  cascade-merge:
    runs-on: ubuntu-latest
    # ai-fix/* PRs only: our AI-generated fixes merge themselves.
    # Dependabot PRs run with GitHub's hard read-only token (no write permission
    # for workflows triggered by dependabot) — those need a manual merge or a
    # PAT-based flow once the project adds one.
    if: startsWith(github.head_ref, 'ai-fix/')
    steps:
      - uses: actions/checkout@v4

      - name: Update branch to latest main (avoid conflicts)
        run: |
          gh pr update-branch --repo "$GITHUB_REPOSITORY" "$PR" || echo "branch already up to date or update unavailable"
          echo "HEAD=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}

      - name: Wait for CI to pass on the updated head
        run: |
          for i in $(seq 1 60); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD/status" --jq '.state')
            echo "attempt $i: CI state = $state"
            if [ "$state" = "success" ]; then
              echo "CI green on $HEAD"
              exit 0
            fi
            if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
              echo "CI failed on $HEAD — not merging"
              exit 1
            fi
            sleep 10
          done
          echo "timed out waiting for CI"
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Merge (cascade, squash)
        run: |
          gh pr merge --repo "$GITHUB_REPOSITORY" --squash --delete-branch "$PR"
          echo "Merged #$PR"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
