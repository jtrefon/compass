name: Auto-merge automated PRs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Why this is minimal on purpose:
# - GITHUB_TOKEN pushes NEVER trigger workflow runs (GitHub's anti-loop rule),
#   and server-side merges don't fire events — so any branch-update logic in
#   this workflow is dead weight. Dependabot rebases its own PRs when main
#   moves, and its pushes are real pushes: they trigger CI and post check
#   suites that ARE visible to the PR merge gate.
# - This workflow's only job: make sure qualifying PRs have auto-merge on.
#   GitHub merges them when CI is green + up-to-date (strict protection).
# - Push-only trigger on purpose: workflow runs triggered by Dependabot PRs
#   require manual approval for write permissions (see AGENTS.md gotchas).
concurrency:
  group: auto-merge-queue
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable auto-merge on qualifying PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          qualify() {
            local branch="$1" labels="$2"
            [[ "$branch" == dependabot/* || "$branch" == ai-fix/* || "$labels" == *"auto-merge"* ]]
          }

          gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,headRefName,labels \
            --jq '.[] | [.number, .headRefName, ([.labels[].name] | join(","))] | @tsv' |
          while IFS=$'\t' read -r num branch labels; do
            if qualify "$branch" "$labels"; then
              echo "== PR #$num ($branch)"
              gh pr merge "$num" --repo "$GITHUB_REPOSITORY" --auto --squash 2>/dev/null \
                || echo "  auto-merge already enabled or unavailable"
            fi
          done
          echo "auto-merge pass complete"
