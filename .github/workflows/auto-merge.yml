name: Auto-merge automated PRs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialized: one update+enable pass at a time. The cascade is emergent:
# after each merge (push to main) this runs again, updates the next PR's
# branch, CI re-runs on the fresh head, GitHub auto-merges when green and
# up-to-date (strict branch protection). No parallel merges, no stale bases.
#
# Push-only on purpose: workflow runs triggered by Dependabot PRs require
# manual approval for write permissions; push-triggered runs never do.
concurrency:
  group: auto-merge-queue
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  update-and-enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update branches and enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only PRs we own or explicitly mark for automation.
          qualify() {
            local branch="$1" labels="$2"
            [[ "$branch" == dependabot/* || "$branch" == ai-fix/* || "$labels" == *"auto-merge"* ]]
          }

          # Every qualifying open PR: refresh its branch, then make sure
          # auto-merge is on. GitHub merges when CI is green + up-to-date.
          gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,headRefName,labels \
            --jq '.[] | [.number, .headRefName, ([.labels[].name] | join(","))] | @tsv' |
          while IFS=$'\t' read -r num branch labels; do
            if qualify "$branch" "$labels"; then
              echo "== PR #$num ($branch)"
              gh pr update-branch "$num" --repo "$GITHUB_REPOSITORY" || echo "  update skipped (conflict or already current)"
              gh pr merge "$num" --repo "$GITHUB_REPOSITORY" --auto --squash 2>/dev/null \
                || echo "  auto-merge already enabled or unavailable"
              # Explicitly launch CI on the branch head: push events alone
              # proved unreliable for these branches. Skip if a run is active.
              ACTIVE=$(gh run list --workflow=ci.yml --branch "$branch" \
                --repo "$GITHUB_REPOSITORY" --limit 10 --json status \
                --jq '[.[].status] | any(. == "in_progress" or . == "queued")')
              if [ "$ACTIVE" != "true" ]; then
                gh workflow run ci.yml --ref "$branch" --repo "$GITHUB_REPOSITORY" \
                  && echo "  CI triggered on $branch" || echo "  CI trigger failed"
              else
                echo "  CI already active on $branch"
              fi
            fi
          done
          echo "auto-merge pass complete"
