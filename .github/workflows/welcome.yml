name: Welcome

on:
  issues:
    types: [opened]

# Issues-only on purpose: PR events from Dependabot would require manual
# approval for write permissions (see AGENTS.md gotchas). Dependabot never
# opens issues, so this workflow can never trigger the approval gate.
permissions:
  issues: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const sender = context.payload.sender.login;
            const { data: prior } = await github.rest.issues.listForRepo({
              ...context.repo,
              creator: sender,
              state: 'all',
              per_page: 1
            });
            if (prior.length > 0) {
              console.log(`${sender} is a returning contributor — no welcome needed`);
              return;
            }
            const isPR = !!context.payload.pull_request;
            const body = isPR
              ? `Hey **@${sender}** — welcome to Compass, and thank you for your first PR! 🙏\n\n` +
                `Before review, please make sure:\n- \`./run.sh build\` passes\n- \`./run.sh test\` passes\n` +
                `- If you touched the agent loop, prompts, or tools: \`./run.sh harness\` passes\n\n` +
                `If you haven't already, read [CONTRIBUTING.md](https://github.com/jtrefon/compass/blob/main/CONTRIBUTING.md). ` +
                `The maintainer will review as soon as humanly possible.`
              : `Hey **@${sender}** — thanks for the first issue on Compass! 🧭\n\n` +
                `A few things that help the maintainer act fast:\n- Steps to reproduce + environment (macOS version, chip, Compass version)\n` +
                `- Logs if it's a crash: \`~/Library/Logs/Compass/\` or \`/tmp/compass-startup.log\`\n\n` +
                `This is a solo-maintainer project — responses can take a day or two, but every issue gets an answer.`;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body
            });
