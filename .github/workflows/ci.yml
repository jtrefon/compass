name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Explicit read-only: CI must never request write permissions.
# Dependabot-triggered runs with write permissions require manual approval
# (see AGENTS.md gotchas) — read-only runs never do.
permissions:
  contents: read

env:
  DERIVED_DATA: .build-ci

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install libomp (OpenMP)
        run: brew install libomp

      - name: Resolve + Build for Testing
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project Compass.xcodeproj \
            -scheme Compass \
            -derivedDataPath "$DERIVED_DATA"
          xcodebuild \
            -project Compass.xcodeproj \
            -scheme Compass \
            -configuration Debug \
            -derivedDataPath "$DERIVED_DATA" \
            -destination 'platform=macOS' \
            build-for-testing \
            CODE_SIGNING_ALLOWED=NO

      - name: Copy Embedding Models
        run: |
          dest="$DERIVED_DATA/Build/Products/Debug/Compass.app/Contents/Resources/EmbeddingModels"
          mkdir -p "$dest"
          rsync -aq --delete Compass/Resources/EmbeddingModels/ "$dest/"

      - name: Cache Derived Data
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/${{ env.DERIVED_DATA }}
          key: derived-${{ github.sha }}

  unit-tests:
    needs: build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install libomp (OpenMP)
        run: brew install libomp

      - name: Restore Derived Data
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.build-ci
          key: derived-${{ github.sha }}

      - name: Run Unit Tests
        run: |
          xcodebuild \
            -project Compass.xcodeproj \
            -scheme Compass \
            -configuration Debug \
            -derivedDataPath "$DERIVED_DATA" \
            -destination 'platform=macOS' \
            -only-testing:CompassTests \
            -skip-testing:CompassTests/OpenAICompatibleChatServiceTests \
            -skip-testing:CompassTests/ConversationPlanStoreLRUTests/testEvictsOldestWhenExceedingMaxCachedPlans \
            -skip-testing:CompassTests/ConversationPolicyTests \
            test-without-building \
            CODE_SIGNING_ALLOWED=NO

  ui-tests:
    needs: build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install libomp (OpenMP)
        run: brew install libomp

      - name: Restore Derived Data
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.build-ci
          key: derived-${{ github.sha }}

      - name: Run UI Tests
        run: |
          xcodebuild \
            -project Compass.xcodeproj \
            -scheme Compass \
            -configuration Debug \
            -derivedDataPath "$DERIVED_DATA" \
            -destination 'platform=macOS' \
            -only-testing:CompassUITests \
            test-without-building \
            CODE_SIGNING_ALLOWED=NO

  publish-artifact:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [unit-tests, ui-tests]
    runs-on: macos-26
    steps:
      - name: Restore Derived Data
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.build-ci
          key: derived-${{ github.sha }}

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Compass-app
          path: .build-ci/Build/Products/Debug/Compass.app
          retention-days: 7
