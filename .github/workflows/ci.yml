name: CI

on:
  # Push-only on purpose. Pull_request-triggered runs from Dependabot PRs are
  # gated behind manual approval (see AGENTS.md gotchas), which blocks the
  # pipeline. Push events on the same branches run ungated and post the same
  # commit checks — the PR shows those. Fork-PR CI can return when the project
  # adds a contributor flow (first-time approval there is normal OSS behavior).
  # workflow_dispatch: the auto-merge cascade triggers CI explicitly per branch
  # after updating it — push events alone proved unreliable for these branches.
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Explicit read-only: CI must never request write permissions.
# Dependabot-triggered runs with write permissions require manual approval
# (see AGENTS.md gotchas) — read-only runs never do.
permissions:
  contents: read

env:
  DERIVED_DATA: .build-ci

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install libomp (OpenMP)
        run: brew install libomp

      - name: Resolve + Build for Testing
        run: |
          PROJECT="$(ls -d *.xcodeproj | head -1)"
          SCHEME="$(basename "$PROJECT" .xcodeproj)"
          echo "Building $PROJECT (scheme $SCHEME)"
          xcodebuild \
            -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -derivedDataPath "$DERIVED_DATA"
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -derivedDataPath "$DERIVED_DATA" \
            -destination 'platform=macOS' \
            build-for-testing \
            CODE_SIGNING_ALLOWED=NO

      - name: Copy Embedding Models
        run: |
          APP_NAME="$(basename "$(ls -d "$DERIVED_DATA"/Build/Products/Debug/*.app | head -1)" .app)"
          MODEL_SRC="$(ls -d */Resources/EmbeddingModels 2>/dev/null | head -1)"
          dest="$DERIVED_DATA/Build/Products/Debug/$APP_NAME.app/Contents/Resources/EmbeddingModels"
          mkdir -p "$dest"
          if [ -n "$MODEL_SRC" ]; then
            rsync -aq --delete "$MODEL_SRC/" "$dest/"
          else
            echo "No EmbeddingModels source found — RAG embeddings disabled in this build"
          fi

      - name: Cache Derived Data
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/${{ env.DERIVED_DATA }}
          key: derived-${{ github.sha }}

  unit-tests:
    # Skip on Dependabot branches: dependency bumps get the required build
    # check only. Keeps the macOS runner queue short and avoids flaky
    # runner-service failures blocking the auto-merge cascade.
    if: "!startsWith(github.ref_name, 'dependabot/')"
    needs: build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install libomp (OpenMP)
        run: brew install libomp

      - name: Restore Derived Data
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.build-ci
          key: derived-${{ github.sha }}

      - name: Run Unit Tests
        run: |
          PROJECT="$(ls -d *.xcodeproj | head -1)"
          SCHEME="$(basename "$PROJECT" .xcodeproj)"
          TEST_MODULE="${SCHEME}Tests"
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -derivedDataPath "$DERIVED_DATA" \
            -destination 'platform=macOS' \
            -only-testing:${TEST_MODULE} \
            -skip-testing:${TEST_MODULE}/OpenAICompatibleChatServiceTests \
            -skip-testing:${TEST_MODULE}/ConversationPlanStoreLRUTests/testEvictsOldestWhenExceedingMaxCachedPlans \
            -skip-testing:${TEST_MODULE}/ConversationPolicyTests \
            test-without-building \
            CODE_SIGNING_ALLOWED=NO

  ui-tests:
    # Skip on Dependabot branches (build-only CI for dependency bumps).
    if: "!startsWith(github.ref_name, 'dependabot/')"
    needs: build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install libomp (OpenMP)
        run: brew install libomp

      - name: Restore Derived Data
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.build-ci
          key: derived-${{ github.sha }}

      - name: Run UI Tests
        run: |
          PROJECT="$(ls -d *.xcodeproj | head -1)"
          SCHEME="$(basename "$PROJECT" .xcodeproj)"
          UI_MODULE="${SCHEME}UITests"
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -derivedDataPath "$DERIVED_DATA" \
            -destination 'platform=macOS' \
            -only-testing:${UI_MODULE} \
            test-without-building \
            CODE_SIGNING_ALLOWED=NO

  publish-artifact:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [unit-tests, ui-tests]
    runs-on: macos-26
    steps:
      - name: Restore Derived Data
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.build-ci
          key: derived-${{ github.sha }}

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Compass-app
          path: .build-ci/Build/Products/Debug/*.app
          retention-days: 7
